name: Littleverse'i yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v5
      - name: Web uygulamasını yayın paketine al
        run: |
          mkdir -p _site
          cp index.html app.js styles.css garden.css character.css room.css explore.css rewards.css marketplace.css diary.css minigames.css design-system.css economy.css events.css friends.css motion.css visual-polish.css atmosphere.css responsive-qa.css character-studio.css supabase-config.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Yayın paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
